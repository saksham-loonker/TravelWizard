services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: travelwizard-postgis
    environment:
      POSTGRES_USER: travelwizard
      POSTGRES_PASSWORD: travelwizard
      POSTGRES_DB: travelwizard
    ports:
      - "5438:5432"
    volumes:
      - travelwizard-postgres:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelwizard -d travelwizard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travelwizard-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - travelwizard-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  travelwizard-postgres:
  travelwizard-redis:
